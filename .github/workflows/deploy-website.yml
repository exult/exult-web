name: deploy-website

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '.git**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: "${{ secrets.SSH_PRIVATE_KEY }}"
          name: id_ed25519
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
      - name: Checkout website
        uses: actions/checkout@master
        with:
          path: exult-web-master
      - name: Upload and update website
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/exult-web-master
          sh ./gen-snapshot-file-details.sh
          for ii in $(seq 1 5); do
            rsync -az --delete \
              --exclude=.git/ \
              --filter='P */' \
              --chmod=Du=rwx,Dg=rx,Do=rx,Fu=rwX,Fg=rX,Fo=rX \
              -e "ssh -o BatchMode=yes -o PasswordAuthentication=no -i ~/.ssh/id_ed25519" \
              $GITHUB_WORKSPACE/exult-web-master/ \
              ${{ secrets.SCP_HOST }}:${{ secrets.PROJECT_HOME }}/htdocs/ \
              && exit 0 || true
          done
          exit 255
